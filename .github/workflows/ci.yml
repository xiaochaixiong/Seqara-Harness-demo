name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - name: Install dependencies
        shell: pwsh
        run: ./scripts/setup-dev.ps1 -PythonPath (Get-Command python).Source
      - name: Test and scan public files
        shell: pwsh
        run: ./scripts/test.ps1
